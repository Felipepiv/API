<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Moedas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5" style="max-width: 480px;">
    <h1 class="mb-4">Conversor de Moedas</h1>

    <div class="mb-3">
      <label class="form-label">Valor</label>
      <div class="input-group">
        <input type="number" class="form-control" id="amount" value="1" min="0">
        <select class="form-select" id="fromCurrency" style="max-width:120px">
          <option value="USD" selected>USD</option>
          <option value="BRL">BRL</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="ARS">ARS</option>
          <option value="JPY">JPY</option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Converter para</label>
      <select class="form-select" id="toCurrency">
        <option value="BRL" selected>BRL</option>
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="ARS">ARS</option>
        <option value="JPY">JPY</option>
      </select>
    </div>

    <button class="btn btn-primary w-100" id="convertBtn">Converter</button>

    <div id="resultado" class="alert alert-success mt-4" style="display:none"></div>
    <div id="erro" class="alert alert-danger mt-2" style="display:none"></div>
  </div>

  <script src="controller.js"></script>
</body>
</html>
